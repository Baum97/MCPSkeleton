name: Bump @modelcontextprotocol/sdk

on:
  schedule:
    - cron: '0 8 * * 1'   # Mondays 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update template pins to latest SDK
        id: bump
        run: |
          python src/utils/fetch_mcp_version.py
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            VERSION=$(python src/utils/fetch_mcp_version.py --print)
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/bump-mcp-sdk
          commit-message: 'chore: bump @modelcontextprotocol/sdk to ${{ steps.bump.outputs.version }}'
          title: 'chore: bump @modelcontextprotocol/sdk to ${{ steps.bump.outputs.version }}'
          body: |
            Automated bump produced by `src/utils/fetch_mcp_version.py`.

            Verify by running `npm test` locally before merging.
