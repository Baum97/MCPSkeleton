name: Release

# Publishes @baum97/create-mcp-server to npm when a version tag is pushed:
#   npm version patch && git push --follow-tags
# Requires the repository secret NPM_TOKEN (npm automation token).
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - uses: astral-sh/setup-uv@v6

      - run: npm ci

      - run: npm run build

      - run: npm test

      - name: End-to-end check of every template
        run: npm run e2e
        env:
          E2E_REQUIRE_UV: '1'

      - name: Tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
