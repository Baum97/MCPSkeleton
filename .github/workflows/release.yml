name: Release

# Publishes @baum97/create-mcp-server to npm when a version tag is pushed:
#   npm version patch && git push --follow-tags
#
# Uses npm trusted publishing (OIDC) — no NPM_TOKEN secret. One-time setup on
# npmjs.com → package → Settings → Trusted publishing → GitHub Actions:
#   user: Baum97, repository: MCPSkeleton, workflow: release.yml,
#   allowed actions: npm publish
# Provenance attestations are generated automatically.

on:
  push:
    tags: ['v*']

permissions:
  contents: write # GitHub release
  id-token: write # OIDC for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships npm 11 (trusted publishing needs npm >= 11.5.1).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@^11.5.1 && npm --version

      - uses: astral-sh/setup-uv@v6

      - run: npm ci

      - run: npm run build

      - run: npm test

      - name: End-to-end check of every template
        run: npm run e2e
        env:
          E2E_REQUIRE_UV: '1'

      - name: Tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      - run: npm publish --access public

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
